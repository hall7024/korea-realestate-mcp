name: release

# v* 태그를 올리면 npm에 배포한다. trusted publishing(OIDC)이라 토큰을 저장하지 않고,
# provenance가 자동으로 붙는다. npm 패키지 설정에서 이 저장소·workflow·environment를 신뢰 게시자로 등록해야 한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # 배포 job은 캐시를 쓰지 않는다 (캐시 오염 방지)
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - name: 태그와 package.json 버전이 같은지 확인
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      # trusted publishing에는 npm 11.5.1 이상이 필요하다. 따로 설치하지 않고 Node 24에 든 npm을 쓴다
      - name: npm 버전 확인
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      # trusted publishing(OIDC). 토큰 게시는 npm 설정에서 막혀 있다
      - run: npm publish --provenance --access public
