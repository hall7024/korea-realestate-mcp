name: release

# v* 태그를 올리면 npm에 배포한다. trusted publishing(OIDC)이라 토큰을 저장하지 않고,
# provenance가 자동으로 붙는다. npm 패키지 설정에서 이 저장소·workflow·environment를 신뢰 게시자로 등록해야 한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # 배포 job은 캐시를 쓰지 않는다 (캐시 오염 방지)
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - name: 태그와 package.json·server.json 버전이 같은지 확인
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$TAG"
          test "v$(node -p 'require("./server.json").version')" = "$TAG"
          test "v$(node -p 'require("./server.json").packages[0].version')" = "$TAG"
      # trusted publishing에는 npm 11.5.1 이상이 필요하다. 따로 설치하지 않고 Node 24에 든 npm을 쓴다
      - name: npm 버전 확인
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      # trusted publishing(OIDC). 토큰 게시는 npm 설정에서 막혀 있다
      - run: npm publish --provenance --access public

  # npm 배포가 끝나면 MCP 레지스트리에 같은 버전을 등록한다. GitHub OIDC로 io.github.hall7024 네임스페이스를 인증한다
  registry:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mcp-publisher 설치 (체크섬 확인)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # npm은 게시 후 몇 분 뒤에야 새 버전을 보여 준다. 레지스트리는 npm에 그 버전이 있어야 등록을 받는다
      - name: npm에 새 버전이 보일 때까지 대기 (최대 15분)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for _ in $(seq 1 90); do
            npm view "korea-realestate-mcp@${TAG#v}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
